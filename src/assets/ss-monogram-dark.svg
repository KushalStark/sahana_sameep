<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <!-- Deep Espresso / Charcoal Gradient with Warm Bronze Core -->
    <linearGradient id="espressoMonogram" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#4A3F39" />
      <stop offset="35%" stop-color="#352C28" />
      <stop offset="70%" stop-color="#241D1A" />
      <stop offset="100%" stop-color="#181311" />
    </linearGradient>
  </defs>

  <!-- Outer Fine Ornamental Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#espressoMonogram)" stroke-width="1.5" />
  
  <!-- Inner Delicate Beaded Ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#espressoMonogram)" stroke-width="1" stroke-dasharray="2.5 3" opacity="0.6" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="100" cy="100" r="81" fill="none" stroke="url(#espressoMonogram)" stroke-width="0.75" opacity="0.3" />

  <!-- Top Lotus Crown Ornament -->
  <g transform="translate(100, 16) scale(0.65)" stroke="url(#espressoMonogram)" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -14 C-4 -4, -3 4, 0 14 C3 4, 4 -4, 0 -14 Z" fill="url(#espressoMonogram)" fill-opacity="0.2" />
    <path d="M0 14 C-8 4, -14 -4, -11 -11 C-5 -8, -2 4, 0 14 Z" />
    <path d="M0 14 C8 4, 14 -4, 11 -11 C5 -8, 2 4, 0 14 Z" />
    <circle cx="0" cy="-16" r="1.5" fill="url(#espressoMonogram)" />
  </g>

  <!-- Bottom Lotus Finial -->
  <g transform="translate(100, 184) scale(0.65) rotate(180)" stroke="url(#espressoMonogram)" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -14 C-4 -4, -3 4, 0 14 C3 4, 4 -4, 0 -14 Z" fill="url(#espressoMonogram)" fill-opacity="0.2" />
    <path d="M0 14 C-8 4, -14 -4, -11 -11 C-5 -8, -2 4, 0 14 Z" />
    <path d="M0 14 C8 4, 14 -4, 11 -11 C5 -8, 2 4, 0 14 Z" />
    <circle cx="0" cy="-16" r="1.5" fill="url(#espressoMonogram)" />
  </g>

  <!-- Interlocking S & S Monogram Core (Proper Orientation, Luxury Serif Calligraphy) -->
  <g fill="url(#espressoMonogram)">
    <!-- First 'S' (Sahana) - Centered around x=76, y=92 -->
    <path d="
      M 94 58
      C 90 52, 82 48, 70 48
      C 54 48, 44 57, 44 71
      C 44 83, 56 90, 72 96
      C 90 102, 100 110, 100 124
      C 100 139, 86 148, 68 148
      C 55 148, 44 142, 41 133
      C 40 130, 43 128, 46 130
      C 52 136, 60 141, 69 141
      C 82 141, 93 133, 93 122
      C 93 109, 81 103, 64 97
      C 48 91, 38 82, 38 69
      C 38 53, 52 42, 70 42
      C 82 42, 91 47, 96 54
      C 98 57, 96 60, 94 58
      Z" 
    />
    <circle cx="95" cy="56" r="3.2" />
    <circle cx="43" cy="132" r="3.2" />

    <!-- Second 'S' (Sameep) - Offset to the right & down, x=124, y=108 -->
    <path d="
      M 152 70
      C 148 64, 140 60, 128 60
      C 112 60, 102 69, 102 83
      C 102 95, 114 102, 130 108
      C 148 114, 158 122, 158 136
      C 158 151, 144 160, 126 160
      C 113 160, 102 154, 99 145
      C 98 142, 101 140, 104 142
      C 110 148, 118 153, 127 153
      C 140 153, 151 145, 151 134
      C 151 121, 139 115, 122 109
      C 106 103, 96 94, 96 81
      C 96 65, 110 54, 128 54
      C 140 54, 149 59, 154 66
      C 156 69, 154 72, 152 70
      Z"
    />
    <circle cx="153" cy="68" r="3.2" />
    <circle cx="101" cy="144" r="3.2" />

    <!-- Romantic Calligraphic Ampersand Knot at Center -->
    <path d="
      M 103 86
      C 106 82, 109 82, 108 86
      C 106 91, 100 96, 95 101
      C 89 108, 86 116, 92 121
      C 97 125, 105 123, 110 116
      C 112 114, 114 116, 113 118
      C 107 127, 95 128, 88 122
      C 82 116, 84 105, 91 97
      C 97 90, 103 85, 103 86
      Z"
      opacity="0.85"
    />
  </g>
</svg>
